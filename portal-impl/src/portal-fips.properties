##
## FIPS 140-2/140-3 Compliant Configuration
##
## Include this file in your portal-ext.properties to enable FIPS mode:
##
##     include-and-override=portal-fips.properties
##
## Important: Before enabling FIPS mode, ensure that:
##   1. A FIPS-certified security provider (e.g., Bouncy Castle FIPS) is
##      configured in your JVM.
##   2. All existing database upgrade processes have been run.
##   3. TOTP-based MFA users re-enroll with SHA-256 compatible authenticator
##      apps (e.g., Authy, FreeOTP).
##

portal.security.fips.mode.enabled=true

company.encryption.algorithm=AES
company.encryption.key.size=256
company.encryption.keystore.type=PKCS12

## REQUIRED: Set a strong, unique password for the company encryption KeyStore.
## The default password is not allowed in FIPS mode.
#company.encryption.keystore.password=

passwords.encryption.algorithm=PBKDF2WithHmacSHA256/256/1300000

auth.mac.algorithm=HmacSHA256

saml.keystore.type=PKCS12

##
## JDBC Credentials
##
## FIPS mode requires that database passwords are NOT stored as plaintext in
## properties files. Use one of the following approaches:
##
## Option 1: JNDI DataSource (recommended)
##   Configure the datasource in Tomcat's context.xml and reference it here:
##
##     jdbc.default.jndi.name=jdbc/LiferayPool
##
## Option 2: Secure Credential Provider (HashiCorp Vault)
##   Reference the secret path and field in the password property:
##
##     jdbc.default.password=secure-credential://secret/data/liferay/database#password
##
##   Then configure one of the following Vault auth methods:
##
##   a) AppRole (recommended for FedRAMP):
##      Set VAULT_ADDR, VAULT_ROLE_ID, and VAULT_SECRET_ID env vars.
##      The secret_id is single-use and consumed at startup.
##      Optionally set VAULT_APPROLE_MOUNT (default: approle).
##
##   b) Kubernetes (recommended for K8s deployments):
##      Set VAULT_ADDR and VAULT_K8S_ROLE env vars.
##      Authentication uses the pod's ServiceAccount JWT automatically.
##      Optionally set VAULT_K8S_MOUNT (default: kubernetes).
##
##   c) Static token (development only — NOT FedRAMP compliant):
##      Set VAULT_ADDR and VAULT_TOKEN env vars.
##
## WARNING: Do NOT use environment variable injection (e.g.,
##   jdbc.default.password=${DB_PASSWORD}) in FIPS mode. Environment variables
##   are plaintext in /proc/<pid>/environ, persist for the process lifetime,
##   cannot be zeroed (Java String), and violate SP 800-53 SC-28 / IA-5.
##
