##
## FIPS 140-2/140-3 Compliant Configuration
##
## Include this file in your portal-ext.properties to enable FIPS mode:
##
##     include-and-override=portal-fips.properties
##
## Important: Before enabling FIPS mode, ensure that:
##   1. A FIPS-certified security provider (e.g., Bouncy Castle FIPS) is
##      configured in your JVM.
##   2. All existing database upgrade processes have been run.
##   3. TOTP-based MFA users re-enroll with SHA-256 compatible authenticator
##      apps (e.g., Authy, FreeOTP).
##

portal.security.fips.mode.enabled=true

company.encryption.algorithm=AES
company.encryption.key.size=256
company.encryption.keystore.type=PKCS12

## REQUIRED: Set a strong, unique password for the company encryption KeyStore.
## The default password is not allowed in FIPS mode.
#company.encryption.keystore.password=

passwords.encryption.algorithm=PBKDF2WithHmacSHA256/256/1300000

auth.mac.algorithm=HmacSHA256

saml.keystore.type=PKCS12
